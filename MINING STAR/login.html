<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MINING STAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #050510;
            color: #fff;
            min-height: 100vh;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
        }

        .logo i { color: #667eea; font-size: 2rem; }

        .logo span {
            background: linear-gradient(135deg, #667eea, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-login {
            padding: 10px 25px;
            background: transparent;
            color: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-register {
            padding: 12px 27px;
            background: linear-gradient(135deg, #667eea, #a855f7);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 100px 20px 40px;
        }

        .auth-card {
            background: rgba(15, 15, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .auth-logo i { color: #667eea; font-size: 2rem; }

        .auth-logo span {
            background: linear-gradient(135deg, #667eea, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .auth-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.95rem;
        }

        /* ===== INPUT WRAPPER - FULL WIDTH ===== */
        .input-wrapper {
            position: relative;
            width: 100%;
            display: block;
        }

        /* Left icon */
        .input-icon-left {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 1rem;
            pointer-events: none;
            z-index: 2;
        }

        /* Right icon (eye button) */
        .input-icon-right {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 1rem;
            z-index: 2;
            transition: 0.3s;
            background: transparent;
            border: none;
            padding: 5px;
        }

        .input-icon-right:hover {
            color: #667eea;
        }

        /* ===== INPUT FIELD - FULL WIDTH ===== */
        .input-wrapper input {
            display: block;
            width: 100%;
            padding: 15px 45px 15px 45px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            color: white !important;
            font-size: 1rem;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        .input-wrapper.no-right input {
            padding-right: 15px;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .input-wrapper input::placeholder {
            color: #666;
        }

        /* ===== FIX BROWSER AUTOFILL BACKGROUND ===== */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px rgba(15, 15, 30, 1) inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #a855f7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .message.success {
            background: rgba(16, 217, 196, 0.1);
            border: 1px solid #10d9c4;
            color: #10d9c4;
        }

        @media (max-width: 500px) {
            .nav-buttons .btn-login { display: none; }
            .auth-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <nav>
        <a href="index.html" class="logo">
            <i class="fas fa-star"></i>
            <span>MINING STAR</span>
        </a>
        <div class="nav-buttons">
            <a href="login.html" class="btn-login">Login</a>
            <a href="register.html" class="btn-register">Register</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-star"></i>
                <span>MINING STAR</span>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your account</p>

            <div class="message" id="message"></div>

            <!-- ⚠️ autocomplete="off" add করা হয়েছে -->
            <form id="loginForm" autocomplete="off">
                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper no-right">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" 
                               id="email" 
                               name="email_login_field" 
                               placeholder="Enter your email" 
                               autocomplete="new-email"
                               required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input type="password" 
                               id="password" 
                               name="password_login_field" 
                               placeholder="Enter password" 
                               autocomplete="new-password"
                               required>
                        <button type="button" class="input-icon-right" onclick="togglePassword('password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script>
        // Clear fields on page load
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }, 100);
        });

        // Stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Check if verified
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('verified') === 'true') {
            const msg = document.getElementById('message');
            msg.textContent = '✅ Email verified! Please login.';
            msg.className = 'message success';
            msg.style.display = 'block';
        }

        // Toggle Password
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        // Form Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                showMessage('✅ Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                showMessage('❌ Invalid email or password!', 'error');
            }
        });
    </script>
</body>
</html>
